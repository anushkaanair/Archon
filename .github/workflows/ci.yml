name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Backend lint
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-lint:
    name: Backend — Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app/ tests/

      - name: Format check (ruff format)
        run: ruff format --check app/ tests/

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Backend type-check — hard gate, no continue-on-error
# ─────────────────────────────────────────────────────────────────────────────
  backend-typecheck:
    name: Backend — Type Check
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --strict-optional

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Security audit (pip-audit)
# ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend — Security Audit
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit + project deps
        run: pip install pip-audit && pip install -e "."

      - name: Audit dependencies for known CVEs
        run: pip-audit --skip-editable -f json -o pip-audit-results.json || pip-audit --skip-editable

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          if-no-files-found: ignore

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: Backend tests (postgres + redis services)
# ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: archon
          POSTGRES_PASSWORD: archon
          POSTGRES_DB: archon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://archon:archon@localhost:5432/archon_test
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-key' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      API_KEY_HASH_SECRET: ci-test-secret
      JWT_SECRET: ci-test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: >
          pytest tests/ -v --tb=short
          --cov=app --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ─────────────────────────────────────────────────────────────────────────────
# Job 5: Frontend — TypeScript check, lint, production build
# ─────────────────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend — Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

# ─────────────────────────────────────────────────────────────────────────────
# Job 6: Gate — required status check for branch protection
# ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: "✅ All checks passed"
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-security, backend-test, frontend-check]
    if: always()

    steps:
      - name: Check all required jobs succeeded
        run: |
          if [[ "${{ needs.backend-lint.result }}"      != "success" ||
                "${{ needs.backend-typecheck.result }}" != "success" ||
                "${{ needs.backend-security.result }}"  != "success" ||
                "${{ needs.backend-test.result }}"      != "success" ||
                "${{ needs.frontend-check.result }}"    != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
